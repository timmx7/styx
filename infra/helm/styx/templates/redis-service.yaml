{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "styx.fullname" . }}-redis
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: tcp-redis
      port: {{ .Values.redis.service.port }}
      targetPort: tcp-redis
      protocol: TCP
  selector:
    {{- include "styx.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
{{- end }}

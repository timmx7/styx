{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "styx.fullname" . }}-router
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  {{- if not .Values.router.autoscaling.enabled }}
  replicas: {{ .Values.router.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "styx.selectorLabels" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/router-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.router.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "styx.componentLabels" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      {{- include "styx.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "styx.podSecurityContext" . | nindent 8 }}
      containers:
        - name: router
          image: {{ include "styx.image" (dict "root" . "image" .Values.router.image) }}
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          securityContext:
            {{- include "styx.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.router.service.port }}
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: {{ include "styx.backendUrl" . | quote }}
            - name: CLASSIFIER_URL
              value: {{ include "styx.classifierUrl" . | quote }}
            - name: CACHE_SERVICE_URL
              value: {{ include "styx.cacheServiceUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "styx.redisUrl" . | quote }}
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "styx.secretName" . }}
                  key: INTERNAL_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "styx.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "styx.secretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "styx.secretName" . }}
                  key: GOOGLE_API_KEY
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "styx.secretName" . }}
                  key: MISTRAL_API_KEY
                  optional: true
            {{- range $key, $value := .Values.router.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          {{- with .Values.router.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.router.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.router.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "styx.routerConfigMapName" . }}
      {{- with .Values.router.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

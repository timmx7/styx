{{/*
══════════════════════════════════════════════════════════════════════
Secret — all sensitive credentials in one place.
In production, consider replacing with External Secrets Operator or
Sealed Secrets so that real values never live in Helm values files.
══════════════════════════════════════════════════════════════════════
*/}}
{{- if not .Values.secrets.jwtSecret }}
  {{- fail "secrets.jwtSecret is required. Generate with: openssl rand -base64 32" }}
{{- end }}
{{- if not .Values.secrets.internalSecret }}
  {{- fail "secrets.internalSecret is required. Generate with: openssl rand -base64 32" }}
{{- end }}
{{- if not .Values.secrets.apiKeyHmacSecret }}
  {{- fail "secrets.apiKeyHmacSecret is required. Generate with: openssl rand -base64 32" }}
{{- end }}
{{- if not .Values.secrets.postgresPassword }}
  {{- fail "secrets.postgresPassword is required. Generate with: openssl rand -base64 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "styx.secretName" . }}
  labels:
    {{- include "styx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- Auth & internal communication ---
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_SECRET: {{ .Values.secrets.internalSecret | quote }}
  API_KEY_HMAC_SECRET: {{ .Values.secrets.apiKeyHmacSecret | quote }}

  # --- Encryption (BYOK provider keys) ---
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKeyPrevious }}
  ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.encryptionKeyPrevious | quote }}
  {{- end }}

  # --- AI provider keys ---
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.googleApiKey }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  {{- end }}

  # --- Stripe ---
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}

  # --- Database ---
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # --- Redis ---
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}

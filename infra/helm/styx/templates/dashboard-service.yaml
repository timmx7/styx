{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "styx.fullname" . }}-dashboard
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "styx.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
{{- end }}

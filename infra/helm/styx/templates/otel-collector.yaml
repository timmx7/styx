{{- if .Values.observability.otel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "styx.fullname" . }}-otel-collector
  labels:
    {{- include "styx.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "styx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.observability.otel.image | default "otel/opentelemetry-collector-contrib:0.96.0" }}
          ports:
            - containerPort: 4317   # OTLP gRPC
              name: otlp-grpc
            - containerPort: 4318   # OTLP HTTP
              name: otlp-http
            - containerPort: 8888   # Prometheus metrics
              name: metrics
            - containerPort: 8889   # Prometheus exporter
              name: prometheus
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "styx.fullname" . }}-otel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "styx.fullname" . }}-otel-config
  labels:
    {{- include "styx.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      resource:
        attributes:
          - key: service.namespace
            value: styx
            action: upsert

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: styx
      otlp/jaeger:
        endpoint: {{ .Values.observability.otel.jaegerEndpoint | default "jaeger-collector:4317" }}
        tls:
          insecure: true
      logging:
        loglevel: warn

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/jaeger, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "styx.fullname" . }}-otel-collector
  labels:
    {{- include "styx.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 8889
      targetPort: prometheus
  selector:
    app.kubernetes.io/component: otel-collector
{{- end }}

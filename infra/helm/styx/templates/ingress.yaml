{{/*
══════════════════════════════════════════════════════════════════════
Ingress — point d'entrée HTTPS pour Styx.

Route le trafic vers :
  /v1/*  → Go Router  (API gateway IA)
  /api/* → Backend    (business logic, auth, billing)
  /*     → Dashboard  (interface web)

Les annotations TLS/sécurité sont séparées en deux blocs :
  1. Annotations utilisateur (values.ingress.annotations)
  2. Annotations de hardening automatiques (TLS, headers, timeouts)

Le hardening est ajouté SEULEMENT quand TLS est activé, pour ne pas
casser le setup dev sans HTTPS.
══════════════════════════════════════════════════════════════════════
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "styx.fullname" . }}
  labels:
    {{- include "styx.labels" . | nindent 4 }}
  annotations:
    {{- /* — Annotations utilisateur — */}}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- /* — Hardening TLS automatique (seulement si TLS activé) — */}}
    {{- if .Values.ingress.tls }}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/ssl-redirect") }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/force-ssl-redirect") }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
    {{- /* HSTS — force HTTPS pendant 1 an, incluant les sous-domaines */}}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/configuration-snippet") }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
    {{- end }}
    {{- /* Timeouts adaptés aux réponses IA longues + streaming SSE */}}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-read-timeout") }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    {{- end }}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-send-timeout") }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    {{- end }}
    {{- /* SSE streaming — désactiver le buffering pour les réponses en temps réel */}}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-buffering") }}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- end }}
    {{- /* Taille max du body (pour les requêtes avec de longs prompts) */}}
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-body-size") }}
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    {{- end }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "router" }}
                name: {{ include "styx.fullname" $ }}-router
                port:
                  number: {{ $.Values.router.service.port }}
                {{- else if eq .service "backend" }}
                name: {{ include "styx.fullname" $ }}-backend
                port:
                  number: {{ $.Values.backend.service.port }}
                {{- else if eq .service "dashboard" }}
                name: {{ include "styx.fullname" $ }}-dashboard
                port:
                  number: {{ $.Values.dashboard.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

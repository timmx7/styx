{{- if .Values.cacheService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "styx.fullname" . }}-cache-service
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "cache-service") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.cacheService.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "styx.selectorLabels" (dict "root" . "component" "cache-service") | nindent 4 }}
{{- end }}

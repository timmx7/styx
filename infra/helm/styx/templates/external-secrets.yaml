{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator (ESO) resources for Vault/AWS Secrets Manager integration.
# Requires: external-secrets-operator to be installed on the cluster.
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "styx.fullname" . }}-secret-store
  labels:
    {{- include "styx.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "styx.fullname" . }}-sa
    {{- else if eq .Values.externalSecrets.provider "vault" }}
    vault:
      server: {{ .Values.externalSecrets.vault.address | quote }}
      path: {{ .Values.externalSecrets.vault.path | default "secret" | quote }}
      version: {{ .Values.externalSecrets.vault.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.externalSecrets.vault.role | default "styx" | quote }}
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "styx.fullname" . }}-app-secrets
  labels:
    {{- include "styx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "styx.fullname" . }}-secret-store
    kind: SecretStore
  target:
    name: {{ include "styx.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/jwt-secret
    - secretKey: internal-secret
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/internal-secret
    - secretKey: api-key-hmac-secret
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/api-key-hmac-secret
    - secretKey: encryption-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/encryption-key
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/database-url
    - secretKey: redis-url
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/redis-url
    - secretKey: stripe-secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/stripe-secret-key
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/stripe-webhook-secret
---
# Provider API keys (BYOK fallback keys)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "styx.fullname" . }}-provider-keys
  labels:
    {{- include "styx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "styx.fullname" . }}-secret-store
    kind: SecretStore
  target:
    name: {{ include "styx.fullname" . }}-provider-keys
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/openai-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/anthropic-api-key
    - secretKey: google-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/google-api-key
    - secretKey: mistral-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.prefix | default "styx" }}/mistral-api-key
{{- end }}

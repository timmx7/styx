{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "styx.fullname" . }}-postgresql
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None     # Headless for StatefulSet
  ports:
    - name: tcp-pg
      port: {{ .Values.postgresql.service.port }}
      targetPort: tcp-pg
      protocol: TCP
  selector:
    {{- include "styx.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
{{- end }}

{{/*
══════════════════════════════════════════════════════════════════════
Grafana Dashboard ConfigMaps — auto-discovered by the Grafana sidecar.

The kube-prometheus-stack Grafana deployment includes a sidecar that
watches for ConfigMaps with the label "grafana_dashboard: '1'" and
loads them as dashboard JSON files.

Dashboards:
  1. styx-overview      — Golden Signals (traffic, errors, latency, cache)
  2. styx-providers     — Per-provider intelligence and cost analysis
  3. styx-infrastructure — Kubernetes pods, resources, storage, network
══════════════════════════════════════════════════════════════════════
*/}}
{{- if and .Values.monitoring.enabled .Values.monitoring.dashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "styx.fullname" . }}-dashboard-overview
  labels:
    {{- include "styx.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Styx"
data:
  styx-overview.json: |-
{{ .Files.Get "dashboards/styx-overview.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "styx.fullname" . }}-dashboard-providers
  labels:
    {{- include "styx.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Styx"
data:
  styx-providers.json: |-
{{ .Files.Get "dashboards/styx-providers.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "styx.fullname" . }}-dashboard-infrastructure
  labels:
    {{- include "styx.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Styx"
data:
  styx-infrastructure.json: |-
{{ .Files.Get "dashboards/styx-infrastructure.json" | indent 4 }}
{{- end }}

{{/*
══════════════════════════════════════════════════════════════════════
Horizontal Pod Autoscalers — one per scalable service.
Enabled per-service in values (e.g. router.autoscaling.enabled: true).
══════════════════════════════════════════════════════════════════════
*/}}

{{- if and .Values.router.enabled .Values.router.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "styx.fullname" . }}-router
  labels:
    {{- include "styx.componentLabels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "styx.fullname" . }}-router
  minReplicas: {{ .Values.router.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.router.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.router.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.router.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.router.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}


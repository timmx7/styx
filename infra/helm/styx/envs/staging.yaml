# ══════════════════════════════════════════════════════════════════════
# Staging environment — production-like but smaller scale
# Usage: helm install styx . -f envs/staging.yaml --set secrets.jwtSecret=...
# ══════════════════════════════════════════════════════════════════════

# IMPORTANT: Override secrets on the command line or via --set-file.
# Do NOT commit real secrets here.

router:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

backend:
  replicaCount: 2
  debug: false
  corsOrigins: "https://staging.styx.ai"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

classifier:
  replicaCount: 2

cacheService:
  replicaCount: 2

dashboard:
  replicaCount: 1
  publicApiUrl: "https://staging.styx.ai"

postgresql:
  persistence:
    size: 10Gi

redis:
  persistence:
    size: 2Gi

qdrant:
  persistence:
    size: 10Gi

clickhouse:
  persistence:
    size: 20Gi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # Let's Encrypt STAGING — certificats non reconnus, mais pas de rate limit
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: staging.styx.ai
      paths:
        - path: /v1
          pathType: Prefix
          service: router
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: styx-staging-tls
      hosts:
        - staging.styx.ai

# -- Let's Encrypt — ClusterIssuers
# Override --set certManager.clusterIssuers.email=infra@styx.ai
certManager:
  enabled: false       # installer séparément en staging si déjà présent
  clusterIssuers:
    enabled: true
    email: ""          # OBLIGATOIRE — passer via --set
    ingressClass: nginx

networkPolicies:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s

# -- Monitoring stack (Prometheus + Grafana + Alertmanager)
monitoring:
  enabled: true
  dashboards:
    enabled: true
  alertingRules:
    enabled: true
  grafana:
    enabled: true
    adminPassword: "change-me-staging"
    persistence:
      enabled: false
  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 10Gi

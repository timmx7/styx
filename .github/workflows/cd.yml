name: Styx CD

on:
  workflow_run:
    workflows: ["Styx CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a running deployment

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ─── Build and push Docker images ───────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # Only proceed if CI passed (for workflow_run trigger) or if it's a tag push
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: router
            context: ./router
          - name: backend
            context: ./backend
          - name: dashboard
            context: ./dashboard
          - name: classifier
            context: ./classifier
          - name: cache-service
            context: ./cache-service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to staging ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          export IMAGE_TAG="${{ github.sha }}"
          TAG=${IMAGE_TAG:0:7}
          NS=styx-staging
          kubectl set image deployment/router router=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/router:${TAG} -n ${NS}
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${TAG} -n ${NS}
          kubectl set image deployment/dashboard dashboard=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dashboard:${TAG} -n ${NS}
          kubectl set image deployment/classifier classifier=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/classifier:${TAG} -n ${NS}
          kubectl set image deployment/cache-service cache-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache-service:${TAG} -n ${NS}
          kubectl rollout status deployment/router -n ${NS} --timeout=300s
          kubectl rollout status deployment/backend -n ${NS} --timeout=300s
          kubectl rollout status deployment/dashboard -n ${NS} --timeout=300s
          kubectl rollout status deployment/classifier -n ${NS} --timeout=300s
          kubectl rollout status deployment/cache-service -n ${NS} --timeout=300s

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          # Health check
          curl -sf "${STAGING_URL}/health" | grep -q '"status":"ok"'
          echo "Staging health check passed"

      - name: Rollback staging on failure
        if: failure()
        run: |
          NS=styx-staging
          echo "Staging deployment failed — rolling back all services"
          kubectl rollout undo deployment/router -n ${NS}
          kubectl rollout undo deployment/backend -n ${NS}
          kubectl rollout undo deployment/dashboard -n ${NS}
          kubectl rollout undo deployment/classifier -n ${NS}
          kubectl rollout undo deployment/cache-service -n ${NS}
          kubectl rollout status deployment/router -n ${NS} --timeout=300s
          kubectl rollout status deployment/backend -n ${NS} --timeout=300s
          echo "Rollback completed for staging"

  # ─── Deploy to production (only on tags) ────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to production (rolling update)
        run: |
          export IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          NS=styx
          kubectl set image deployment/router router=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/router:${IMAGE_TAG} -n ${NS}
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${IMAGE_TAG} -n ${NS}
          kubectl set image deployment/dashboard dashboard=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/dashboard:${IMAGE_TAG} -n ${NS}
          kubectl set image deployment/classifier classifier=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/classifier:${IMAGE_TAG} -n ${NS}
          kubectl set image deployment/cache-service cache-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cache-service:${IMAGE_TAG} -n ${NS}
          kubectl rollout status deployment/router -n ${NS} --timeout=600s
          kubectl rollout status deployment/backend -n ${NS} --timeout=600s
          kubectl rollout status deployment/dashboard -n ${NS} --timeout=600s
          kubectl rollout status deployment/classifier -n ${NS} --timeout=600s
          kubectl rollout status deployment/cache-service -n ${NS} --timeout=600s

      - name: Production smoke test
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          curl -sf "${PROD_URL}/health" | grep -q '"status":"ok"'
          echo "Production health check passed"

      - name: Rollback production on failure
        if: failure()
        run: |
          NS=styx
          echo "Production deployment failed — rolling back all services"
          kubectl rollout undo deployment/router -n ${NS}
          kubectl rollout undo deployment/backend -n ${NS}
          kubectl rollout undo deployment/dashboard -n ${NS}
          kubectl rollout undo deployment/classifier -n ${NS}
          kubectl rollout undo deployment/cache-service -n ${NS}
          kubectl rollout status deployment/router -n ${NS} --timeout=600s
          kubectl rollout status deployment/backend -n ${NS} --timeout=600s
          echo "Rollback completed for production"

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"Production deployment FAILED for ${{ github.ref }} — automatic rollback triggered"}'

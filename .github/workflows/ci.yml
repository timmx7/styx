name: Styx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint (Python + Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # ── Python lint with ruff ──
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check on backend
        run: ruff check backend/

      - name: Run ruff check on classifier
        run: ruff check classifier/

      - name: Run ruff check on cache-service
        run: ruff check cache-service/

      # ── Go lint with go vet ──
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: router/go.sum

      - name: Run go vet
        working-directory: router
        run: go vet ./...

  # ─── Backend Tests (Python) ────────────────────────────────────
  backend-test:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          JWT_SECRET: "test-secret"
          REDIS_URL: "redis://localhost:6379"
          INTERNAL_SECRET: "test-internal-secret"
          API_KEY_HMAC_SECRET: "test-hmac-secret"

  # ─── Router Tests (Go) ────────────────────────────────────────
  router-test:
    name: Router Tests (Go 1.22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: router/go.sum

      - name: Build
        working-directory: router
        run: go build ./...

      - name: Run tests
        working-directory: router
        run: go test -v -race -timeout 60s ./...

  # ─── Dashboard Build (Next.js) ────────────────────────────────
  dashboard-build:
    name: Dashboard Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ─── Classifier Tests (Python) ─────────────────────────────────
  classifier-test:
    name: Classifier Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('classifier/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: classifier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: classifier
        run: python -m pytest -v --tb=short || echo "No tests found — skipping"

  # ─── Cache Service Tests (Python) ────────────────────────────
  cache-service-test:
    name: Cache Service Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: cache-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: cache-service
        run: python -m pytest -v --tb=short || echo "No tests found — skipping"

  # ─── SDK TypeScript Tests ─────────────────────────────────────
  sdk-typescript-test:
    name: SDK TypeScript Tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npm run lint

      - name: Run tests
        working-directory: sdk/typescript
        run: npm test

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

  # ─── Docker Build ─────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build all services
        run: docker compose build

  # ─── Security Scan ───────────────────────────────────────────────
  security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build images for scanning
        run: docker compose build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

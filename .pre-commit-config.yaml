# Pre-commit hooks — local security enforcement
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# These hooks catch security issues BEFORE code reaches CI/CD.

repos:
  # ─── General Hygiene ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key    # Catches SSH/PGP private keys
      - id: check-case-conflict
      - id: check-symlinks

  # ─── Secrets Detection ───────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ─── Python SAST (Bandit) ────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ['-c', '.bandit.yaml', '-r']
        files: ^(backend|classifier|cache-service)/
        exclude: ^.*/tests/

  # ─── Python Linting (Ruff) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ['--fix']
        files: ^(backend|classifier|cache-service)/
      - id: ruff-format
        files: ^(backend|classifier|cache-service)/

  # ─── Go Linting ─────────────────────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-vet
        files: ^router/
      - id: go-build
        files: ^router/

  # ─── Dockerfile Linting ─────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: ['--ignore', 'DL3008', '--ignore', 'DL3018']
        # DL3008: pin apt versions (noisy), DL3018: pin apk versions (noisy)

# ══════════════════════════════════════════════════════════════════════
# Styx — Docker Compose (Development)
#
# Architecture overview:
#   Client -> Nginx (TLS termination, :80/:443)
#     -> Dashboard (Next.js, :3000)     — web UI
#     -> Backend  (FastAPI, :8000)      — business logic, auth, billing
#     -> Router   (Go, :8080)          — reverse proxy to AI providers
#       -> Classifier (Python, :8001)  — ML complexity classification
#       -> Cache Service (Python, :8002) — semantic cache via Qdrant
#       -> Redis (:6379)               — rate limiting, real-time counters
#     -> PostgreSQL (:5432)            — persistent storage (users, projects, keys)
#     -> ClickHouse (:8123)            — analytics time-series data
#     -> Qdrant (:6333)                — vector DB for semantic cache
#
# Networking:
#   - "frontend" network: nginx + dashboard (public-facing)
#   - "backend" network: all internal services
#   - nginx and backend bridge both networks
#
# Usage:
#   docker compose up -d
#   docker compose --profile mcp up -d   # include MCP server
# ══════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  # Primary relational database for users, projects, API keys, budgets.
  # Backup strategy: use pg_dump or pgBackRest for production;
  # in dev, the named volume 'pgdata' persists across restarts.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: styx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-styx-dev-only}
      POSTGRES_DB: styx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U styx" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    labels:
      com.styx.service: "postgres"
      com.styx.role: "database"

  # ─── Redis ─────────────────────────────────────────────────────
  # Used for rate limiting, real-time spend counters, and session cache.
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-styx-dev-only}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-styx-dev-only}
    volumes:
      - redisdata:/data
    healthcheck:
      # Use CMD-SHELL to avoid interpolating password into the command line
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      com.styx.service: "redis"
      com.styx.role: "cache"

  # ─── Qdrant (Vector DB for semantic cache) ─────────────────────
  # Stores embedding vectors for the semantic cache service.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    labels:
      com.styx.service: "qdrant"
      com.styx.role: "vector-database"

  # ─── ClickHouse (Analytics DB) ──────────────────────────────────
  # Time-series analytics: stores request logs, latency metrics,
  # provider usage, and cost data for the analytics dashboard.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: styx
      # Use a dedicated user instead of the default admin user
      CLICKHOUSE_USER: styx
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-styx-dev-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      # Authenticate the healthcheck with the configured user
      test: [ "CMD", "clickhouse-client", "--user", "styx", "--password", "${CLICKHOUSE_PASSWORD:-styx-dev-only}", "--query", "SELECT 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    labels:
      com.styx.service: "clickhouse"
      com.styx.role: "analytics-database"

  # ─── Python Backend (FastAPI) ──────────────────────────────────
  # Business logic: auth (Supabase JWT), billing (Stripe), project
  # management, API key validation, analytics queries.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"   # Exposed for local dev (MCP, E2E tests). In production, remove this and use nginx only.
    environment:
      DATABASE_URL: postgresql+asyncpg://styx:${POSTGRES_PASSWORD:-styx-dev-only}@postgres:5432/styx
      REDIS_URL: redis://:${REDIS_PASSWORD:-styx-dev-only}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CHARON_SHADE: ${STRIPE_PRICE_CHARON_SHADE:-}
      STRIPE_PRICE_CHARON_OBOL: ${STRIPE_PRICE_CHARON_OBOL:-}
      STRIPE_PRICE_CHARON_FERRYMAN: ${STRIPE_PRICE_CHARON_FERRYMAN:-}
      STRIPE_PRICE_CHARON_TITAN: ${STRIPE_PRICE_CHARON_TITAN:-}
      STRIPE_PRICE_ACHILLES_SPARK: ${STRIPE_PRICE_ACHILLES_SPARK:-}
      STRIPE_PRICE_ACHILLES_BLAZE: ${STRIPE_PRICE_ACHILLES_BLAZE:-}
      STRIPE_PRICE_ACHILLES_INFERNO: ${STRIPE_PRICE_ACHILLES_INFERNO:-}
      SKIP_AUTH: ${SKIP_AUTH:-false}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:-}
      # ENCRYPTION_KEY: Fernet key for at-rest encryption of BYOK provider keys.
      # For key rotation, set ENCRYPTION_KEY_PREVIOUS to the old key before
      # changing ENCRYPTION_KEY — the backend will try both during decryption.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://localhost,https://127.0.0.1}
      CLICKHOUSE_URL: http://clickhouse:8123
      # Must match the CLICKHOUSE_USER set on the clickhouse service
      CLICKHOUSE_USER: styx
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-styx-dev-only}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    labels:
      com.styx.service: "backend"
      com.styx.role: "api"

  # ─── Python Classifier ─────────────────────────────────────────
  # ML service that classifies prompt complexity (simple/medium/complex)
  # to route to the optimal AI provider/model.
  classifier:
    build:
      context: ./classifier
      dockerfile: Dockerfile
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    labels:
      com.styx.service: "classifier"
      com.styx.role: "ml-service"

  # ─── Python Cache Service (Qdrant + Embeddings) ────────────────
  # Semantic cache: embeds prompts with all-MiniLM-L6-v2 and checks
  # Qdrant for similar cached responses before routing to a provider.
  cache-service:
    build:
      context: ./cache-service
      dockerfile: Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.95}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    labels:
      com.styx.service: "cache-service"
      com.styx.role: "cache"

  # ─── Go Router (Reverse Proxy) ────────────────────────────────
  # THE critical path. Receives all AI API requests, validates API keys,
  # checks cache, classifies complexity, routes to the best provider,
  # handles failover via circuit breaker, and streams responses back.
  # Target: <10ms overhead per request.
  router:
    build:
      context: ./router
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # Exposed for local dev (SDK/curl). In production, remove this and use nginx only.
    # Removed env_file: .env — router only needs the explicit vars below.
    # This follows the principle of least privilege for secrets.
    environment:
      BACKEND_URL: http://backend:8000
      CLASSIFIER_URL: http://classifier:8001
      CACHE_SERVICE_URL: http://cache-service:8002
      REDIS_URL: redis://:${REDIS_PASSWORD:-styx-dev-only}@redis:6379
      SKIP_AUTH: ${SKIP_AUTH:-false}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      backend:
        condition: service_healthy
      classifier:
        condition: service_healthy
      cache-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '2.0'
    labels:
      com.styx.service: "router"
      com.styx.role: "proxy"

  # ─── Next.js Dashboard ──────────────────────────────────────────
  # Web UI for managing projects, API keys, viewing analytics,
  # configuring routing rules, and monitoring usage/billing.
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
        - NEXT_PUBLIC_SKIP_AUTH=${SKIP_AUTH:-false}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SKIP_AUTH: ${SKIP_AUTH:-false}
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    labels:
      com.styx.service: "dashboard"
      com.styx.role: "frontend"

  # ─── Nginx Reverse Proxy (HTTPS termination) ─────────────────
  # TLS termination, rate limiting, security headers, and routing
  # between dashboard, backend API, and AI router.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    labels:
      com.styx.service: "nginx"
      com.styx.role: "reverse-proxy"

  # ─── Prometheus (Metrics Scraper) ──────────────────────────────
  # Scrapes /metrics from the router, backend, and other services.
  prometheus:
    image: prom/prometheus:v2.51.0
    # ports removed — Prometheus is internal only, access via Grafana
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      com.styx.service: "prometheus"
      com.styx.role: "monitoring"

  # ─── Grafana (Observability Dashboard) ─────────────────────────
  # Visualization layer for Prometheus metrics. Pre-provisioned with
  # Styx dashboards for request latency, provider health, and costs.
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Secure Grafana defaults
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      com.styx.service: "grafana"
      com.styx.role: "monitoring"

  # ─── Styx MCP Server (optional, enable with --profile mcp) ──
  # SSE transport for internal Docker network access.
  styx-mcp:
    build:
      context: ./styx-mcp-server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      STYX_API_URL: http://backend:8000
      STYX_PROXY_URL: http://router:8080
      STYX_API_KEY: ${STYX_API_KEY:-}
      STYX_TOKEN: ${STYX_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((\"localhost\", 8090)); s.close()'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - mcp
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      com.styx.service: "styx-mcp"
      com.styx.role: "mcp-server"

  # ─── Styx MCP Server — Remote (Streamable HTTP) ─────────────
  # Public-facing MCP server for claude.ai, Claude Desktop, and
  # Claude Code remote connections via https://mcp.styxhq.com/mcp.
  styx-mcp-remote:
    build:
      context: ./styx-mcp-server
      dockerfile: Dockerfile
    command: ["python", "server.py", "--transport", "http"]
    ports:
      - "8081:8081"
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "8081"
      STYX_API_URL: http://backend:8000
      STYX_PROXY_URL: http://router:8080
      STYX_API_KEY: ${STYX_API_KEY:-}
      STYX_TOKEN: ${STYX_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((\"localhost\", 8081)); s.close()'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      com.styx.service: "styx-mcp-remote"
      com.styx.role: "mcp-server-remote"

# ─── Named Volumes ───────────────────────────────────────────────
volumes:
  pgdata:
    name: styx_pgdata
  redisdata:
    name: styx_redisdata
  qdrantdata:
    name: styx_qdrantdata
  clickhousedata:
    name: styx_clickhousedata
  prometheusdata:
    name: styx_prometheusdata
  grafanadata:
    name: styx_grafanadata

# ─── Networks ────────────────────────────────────────────────────
# Network segmentation: frontend (public-facing) and backend (internal).
# nginx bridges both networks to route traffic between them.
networks:
  frontend:
    name: styx_frontend
  backend:
    name: styx_backend

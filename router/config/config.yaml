server:
  port: 8080
  read_timeout_seconds: 30
  write_timeout_seconds: 120  # Long for streaming responses

backend:
  url: "http://backend:8000"

classifier:
  url: "http://classifier:8001"
  timeout_seconds: 3   # Max wait for classification (default: 3s)

cache:
  url: "http://cache-service:8002"
  enabled: true
  timeout_seconds: 5   # Max wait for cache check (default: 5s)

fallback:
  circuit_breaker_max_failures: 5        # failures before tripping
  circuit_breaker_recovery_seconds: 30   # seconds before half-open test
  health_check_interval_seconds: 15      # seconds between health probes

